<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 840 290" width="840" height="290" role="img" aria-label="Esquema del caso real: los clientes reservan online o desde la app de iPhone; las reservas llegan al panel de administración; las cámaras con visión generan un informe diario; el dueño y su equipo lo ven todo cada mañana."><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}</style><rect width="840" height="290" rx="14" fill="#0f0d17"/><defs><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a78bfa"/></marker></defs><text x="24" y="40" font-size="14" font-weight="400" fill="#a8a2bd" text-anchor="start">Todo el software de un grupo de lavaderos de coches, hecho y mantenido por una sola persona</text><rect x="24" y="127" width="176" height="66" rx="10" fill="#181523" stroke="#3b3158" stroke-width="1.5"/><text x="112" y="156" font-size="14.5" font-weight="600" fill="#f5f3fb" text-anchor="middle">Sus clientes</text><text x="112" y="176" font-size="12" font-weight="400" fill="#a8a2bd" text-anchor="middle">piden hora desde el móvil</text><rect x="229" y="72" width="176" height="66" rx="10" fill="#181523" stroke="#3b3158" stroke-width="1.5"/><text x="317" y="101" font-size="14.5" font-weight="600" fill="#f5f3fb" text-anchor="middle">Reservas online</text><text x="317" y="121" font-size="12" font-weight="400" fill="#a8a2bd" text-anchor="middle">sin llamadas ni esperas</text><rect x="229" y="182" width="176" height="66" rx="10" fill="#181523" stroke="#3b3158" stroke-width="1.5"/><text x="317" y="211" font-size="14.5" font-weight="600" fill="#f5f3fb" text-anchor="middle">App para iPhone</text><text x="317" y="231" font-size="12" font-weight="400" fill="#a8a2bd" text-anchor="middle">nativa, en su bolsillo</text><rect x="434" y="72" width="176" height="66" rx="10" fill="#181523" stroke="#3b3158" stroke-width="1.5"/><text x="522" y="101" font-size="14.5" font-weight="600" fill="#f5f3fb" text-anchor="middle">Panel de administración</text><text x="522" y="121" font-size="12" font-weight="400" fill="#a8a2bd" text-anchor="middle">el día a día del negocio</text><rect x="434" y="182" width="176" height="66" rx="10" fill="#181523" stroke="#3b3158" stroke-width="1.5"/><text x="522" y="211" font-size="14.5" font-weight="600" fill="#f5f3fb" text-anchor="middle">Cámaras con visión</text><text x="522" y="231" font-size="12" font-weight="400" fill="#a8a2bd" text-anchor="middle">vigilan y resumen solas</text><rect x="640" y="127" width="176" height="66" rx="10" fill="#181523" stroke="#a78bfa" stroke-width="1.5"/><text x="728" y="156" font-size="14.5" font-weight="600" fill="#f5f3fb" text-anchor="middle">El dueño y su equipo</text><text x="728" y="176" font-size="12" font-weight="400" fill="#a8a2bd" text-anchor="middle">todo claro cada mañana</text><path d="M200 151 L225 112" stroke="#a78bfa" stroke-width="1.6" marker-end="url(#h)" opacity=".9"/><path d="M200 169 L225 208" stroke="#a78bfa" stroke-width="1.6" marker-end="url(#h)" opacity=".9"/><path d="M405 105 L430 105" stroke="#a78bfa" stroke-width="1.6" marker-end="url(#h)" opacity=".9"/><path d="M405 204 L430 124" stroke="#a78bfa" stroke-width="1.6" marker-end="url(#h)" opacity=".9"/><path d="M610 112 L636 151" stroke="#a78bfa" stroke-width="1.6" marker-end="url(#h)" opacity=".9"/><path d="M610 208 L636 169" stroke="#a78bfa" stroke-width="1.6" marker-end="url(#h)" opacity=".9"/><text x="24" y="268" font-size="13" font-weight="400" fill="#a8a2bd" text-anchor="start">Una reserva aparece en el panel al momento, y las cámaras escriben el informe de cada mañana.</text></svg>
